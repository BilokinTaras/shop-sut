name: Collect shop-sut logs
description: >-
  Saves the state and logs of every shop-sut container as an artifact. Call it with `if: failure()` (or
  `always()`) after start-sut, so a red run shows why the stand misbehaved.

inputs:
  path:
    description: Directory shop-sut was checked out into
    required: false
    default: shop-sut
  name:
    description: Artifact name
    required: false
    default: shop-sut-logs

runs:
  using: composite
  steps:
    - name: Dump container state and logs
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        mkdir -p .logs
        docker compose ps --all > .logs/ps.txt 2>&1 || true
        for service in $(docker compose config --services); do
          docker compose logs --no-color --timestamps "$service" > ".logs/$service.log" 2>&1 || true
        done
        echo "::group::container state"; cat .logs/ps.txt; echo "::endgroup::"

    - name: Upload logs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}/.logs/
        retention-days: 14
