version: 2
# A cooldown keeps freshly published releases out for a week: compromised versions are usually found and
# yanked within days, and a portfolio has no reason to be first.
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major versions of the stand's databases are deliberate migrations, not routine bumps: every number in the
    # test projects' reports was measured on PostgreSQL 17 and Redis 7.4, and PostgreSQL 18 images also moved
    # their data directory, so a drop-in bump leaves the container unhealthy. Minor and patch updates still come.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
